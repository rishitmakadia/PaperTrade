# ==============================================================================
# PaperTrade Spring Boot Configuration
# ==============================================================================

spring.application.name=paper-trade

# ── Server Configuration ──────────────────────────────────────────────────────
server.port=${PORT:5001}
server.servlet.context-path=/

# ── PostgreSQL Datasource Configuration ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/papertrade
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=PaperTradeHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ── JPA & Hibernate Configuration ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway Migration ──────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── JWT Security Settings ─────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 7 days in milliseconds
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ── CORS Settings ─────────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:3000}

# ── Market Data Configuration ─────────────────────────────────────────────────
# Mode can be "live" (Yahoo Finance) or "mock" (Simulated realistic data for 24/7 testing)
app.market-data.mode=${MARKET_DATA_MODE:live}
app.market-data.cache-ttl-ms=60000

# ── Price Alert Scheduler Configuration ───────────────────────────────────────
# Poll interval in milliseconds (default: 60 seconds)
app.alerts.scheduler.enabled=${ALERT_SCHEDULER_ENABLED:true}
app.alerts.scheduler.fixed-delay-ms=${ALERT_SCHEDULER_INTERVAL_MS:60000}

# ── Actuator Health Check ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
