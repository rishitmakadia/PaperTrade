# ==============================================================================
# PaperTrade Test Configuration (H2 in-memory DB)
# ==============================================================================

spring.application.name=paper-trade-test

spring.datasource.url=jdbc:h2:mem:papertradetest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

app.market-data.mode=mock
app.market-data.cache-ttl-ms=60000

app.alerts.scheduler.enabled=false
app.alerts.scheduler.fixed-delay-ms=60000
